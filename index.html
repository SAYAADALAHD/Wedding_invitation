<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Ashrul&Diana Wedding</title>

    <link rel="stylesheet" href="css/style.css" />
    <style>
      .opening {
        transition:
          transform 1.4s cubic-bezier(0.77, 0, 0.18, 1),
          opacity 1.1s ease;
      }

      /* Saat tombol ditekan */

      body.opening-exit .opening {
        transform: translateY(-100%);
        opacity: 0;
      }

      .sakura-falling {
        transition: opacity 1.4s ease;
      }

      body.opening-exit .sakura-falling {
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <!-- =========================================
         INVITATION CANVAS
    ========================================== -->

    <main class="invitation-canvas">
      <div class="sakura-falling"></div>
      <!-- =====================================
             OPENING
        ====================================== -->

      <section class="opening">
        <!-- BACKGROUND IMAGE -->

        <div class="opening-image">
          <img
            src="assets/images/webp/Foto-001.webp"
            alt="Foto pengantin"
            fetchpriority="high"
          />
        </div>

        <!-- COLOR / GRADIENT OVERLAY -->

        <div class="opening-gradient"></div>

        <!-- BOKEH OVERLAY  -->
        <div class="opening-bokeh">
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
        </div>

        <!-- OPENING DECORATIONS -->
        <div class="opening-decorations">
          <div class="opening-decorations-right">
            <img
              src="assets/decorations/Flowers 1.png"
              alt="Flowers"
              decoding="async"
            />
          </div>
          <div class="opening-decorations-left">
            <img
              src="assets/decorations/Flowers 1.png"
              alt="Flowers"
              decoding="async"
            />
          </div>
        </div>

        <!-- OPENING CONTENT -->
        <div class="opening-content">
          <!-- TITLE -->

          <p class="opening-label">THE WEDDING OF</p>
          <!-- NAMES -->

          <div class="opening-names">
            <h1>Ashrul</h1>

            <span>&</span>

            <h1>Diana</h1>
          </div>

          <!-- TANGGAL -->
          <p class="tanggal">16 September 2026</p>
          <!-- GUEST -->

          <p class="opening-guest">Kepada Yth. Bapak/Ibu tamu undangan</p>
          <h3 class="nama-tamu" id="nama-tamu">( nama tamu )</h3>

          <!-- OPEN BUTTON -->

          <button id="open-invitation" class="opening-button" type="button">
            Buka Undangan
          </button>
        </div>
      </section>
    </main>

    <!-- JAVASCRIPT -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/timoschaefer/jQuery-Sakura/jquery-sakura.min.js"></script>

    <script src="js/script.js"></script>
  </body>
</html>
